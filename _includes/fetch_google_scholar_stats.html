<script>
(function () {
  var counter = document.getElementById('total_cit');
  var papers = document.querySelectorAll('.show_paper_citations');
  if (!counter && !papers.length) return;
  var base = {% if site.google_scholar_stats_use_cdn %}'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'{% else %}'https://raw.githubusercontent.com/{{ site.repository }}/'{% endif %};
  fetch(base + 'google-scholar-stats/gs_data.json')
    .then(function (response) { if (!response.ok) throw new Error('Citation data unavailable'); return response.json(); })
    .then(function (data) {
      if (counter && typeof data.citedby === 'number') counter.textContent = data.citedby;
      papers.forEach(function (element) {
        var paper = (data.publications || {})[element.getAttribute('data')];
        if (paper && typeof paper.num_citations === 'number') element.textContent = '| Citations: ' + paper.num_citations;
      });
    }).catch(function () { /* Preserve the saved values when offline. */ });
}());
</script>
