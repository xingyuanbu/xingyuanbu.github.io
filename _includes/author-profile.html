<div class="profile_box" itemscope itemtype="https://schema.org/Person">
  <div class="author__avatar"><img src="{{ site.author.avatar | relative_url }}" alt="Xingyuan Bu in Seattle" width="190" height="190" itemprop="image"></div>
  <div class="author__content">
    <h2 class="author__name" itemprop="name">{{ site.author.name }}</h2>
    <p class="author__native-name" lang="zh">卜兴源</p>
    <p class="author__bio">Staff Research Engineer<br>Tech Leader</p>
    <p class="author__employer">ByteDance / TikTok</p>
    <p class="author__location">Shanghai, China</p>
  </div>
  <div class="author__urls-wrapper">
    <ul class="profile-links">
      <li><a href="mailto:{{ site.author.email }}"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i> Email</a></li>
      <li><a href="{{ site.author.googlescholar }}"><i class="fas fa-fw fa-graduation-cap" aria-hidden="true"></i> Google Scholar</a></li>
      <li><a href="https://github.com/{{ site.author.github }}"><i class="fab fa-fw fa-github" aria-hidden="true"></i> GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/"><i class="fab fa-fw fa-linkedin" aria-hidden="true"></i> LinkedIn</a></li>
    </ul>
    <p class="profile-focus">Multimodal AI<br>Video Generation<br>LLMs &amp; Agents</p>
  </div>
</div>
