<title>{{ site.title | escape }} · Homepage</title>
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:locale" content="en_US">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ site.title | escape }} · Homepage">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
{% if site.google_site_verification %}<meta name="google-site-verification" content="{{ site.google_site_verification | escape }}">{% endif %}
{% if site.bing_site_verification %}<meta name="msvalidate.01" content="{{ site.bing_site_verification | escape }}">{% endif %}
{% if site.baidu_site_verification %}<meta name="baidu-site-verification" content="{{ site.baidu_site_verification | escape }}">{% endif %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":{{ site.author.name | jsonify }},"alternateName":"卜兴源","url":{{ site.url | jsonify }},"image":{{ site.author.avatar | absolute_url | jsonify }},"jobTitle":"Staff Research Engineer","worksFor":{"@type":"Organization","name":"ByteDance / TikTok"},"sameAs":[{{ site.author.googlescholar | jsonify }},"https://github.com/{{ site.author.github }}","https://www.linkedin.com/in/{{ site.author.linkedin }}/"]}
</script>
